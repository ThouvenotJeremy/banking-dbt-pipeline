version: 2

sources:
  - name: st0
    schema: "{{ 'main' if target.type == 'duckdb' else 'PUBLIC' }}"
    description: "Couche de données brutes simulant le core banking Avaloq. Toutes les tables sont préfixées st0_."
    tables:
      - name: st0_cli
        description: "Référentiel clients brut extrait du core banking. Une ligne par client, état courant uniquement."
        columns:
          - name: cd_cli
            description: "Code unique du client"
          - name: lb_cli
            description: "Nom complet du client"
          - name: lb_cli_alt
            description: "Nom alternatif du client (format NOM Prénom)"
          - name: dt_cre
            description: "Date de création / ouverture du client"
          - name: dt_clo
            description: "Date de clôture du client (null si actif)"
          - name: cd_cty_dom
            description: "Code pays de domicile (ISO 3166)"
          - name: cd_cty_nat
            description: "Code pays de nationalité (ISO 3166)"
          - name: cd_mng_rel
            description: "Code du relationship manager responsable"
          - name: cd_cli_cat
            description: "Catégorie du client (PRIVATE, RETAIL)"
          - name: cd_ccy
            description: "Code devise de référence du client"

      - name: st0_ptf
        description: "Référentiel portefeuilles brut. Une ligne par portefeuille, état courant."
        columns:
          - name: cd_ptf
            description: "Code unique du portefeuille"
          - name: lb_ptf
            description: "Libellé du portefeuille"
          - name: lb_ptf_alt
            description: "Libellé alternatif"
          - name: dt_cre
            description: "Date d'ouverture"
          - name: dt_clo
            description: "Date de clôture (null si actif)"
          - name: cd_cli
            description: "Client propriétaire"
          - name: cd_ccy
            description: "Devise de référence"
          - name: cd_prf
            description: "Profil de risque"
          - name: cd_mng
            description: "Relationship manager"
          - name: cd_mng_ext
            description: "Gestionnaire externe (null si gérance interne)"
          - name: cd_agn
            description: "Agent de distribution"
          - name: cd_ent
            description: "Entité juridique"
          - name: cd_buu
            description: "Business unit"

      - name: st0_ope_typ
        description: "Types d'opérations financières bruts. Une ligne par type."
        columns:
          - name: cd_ope_typ
            description: "Code unique du type d'opération"
          - name: lb_ope_typ
            description: "Libellé du type d'opération"
          - name: yn_nnm
            description: "Indicateur New Net Money (Y/N)"
          - name: yn_int
            description: "Indicateur flux d'intérêts (Y/N)"
          - name: yn_loa
            description: "Indicateur prêt (Y/N)"

      - name: st0_fct_ope
        description: "Transactions financières brutes. Une ligne par opération."
        columns:
          - name: cd_fct_ope
            description: "Identifiant technique unique de l'opération"
          - name: cd_ope
            description: "Code métier de l'opération"
          - name: cd_ptf
            description: "Code du portefeuille de rattachement"
          - name: cd_ast
            description: "Code de l'actif (titre, instrument)"
          - name: cd_ccy_ope
            description: "Code devise de l'opération"
          - name: cd_ope_typ
            description: "Type d'opération (BUY, SELL)"
          - name: dt_cta
            description: "Date comptable de l'opération"
          - name: dt_val
            description: "Date de valeur de l'opération"
          - name: qt_ope
            description: "Quantité de titres échangés"
          - name: mt_ope
            description: "Montant brut en devise locale"
          - name: mt_ope_ref
            description: "Montant en devise de référence"
          - name: yn_pro
            description: "Indicateur d'opération provisoire (Y/N)"
          - name: ts_stg
            description: "Horodatage de chargement en staging"

      - name: st0_fct_ast
        description: "Positions d'actifs brutes issues du core banking. Une ligne par position et par date de valorisation."
        columns:
          - name: cd_fct_ast
            description: "Identifiant unique de la position (CD_PTF-CD_AST-YYYYMMDD)"
          - name: cd_pos
            description: "Code de la position"
          - name: cd_pos_typ
            description: "Type de position (T=titres, C=cash)"
          - name: cd_ptf
            description: "Portefeuille de rattachement"
          - name: dt_fct
            description: "Date de valorisation"
          - name: cd_ccy
            description: "Devise de la position"
          - name: cd_ins
            description: "Instrument financier"
          - name: cd_ast
            description: "Actif financier"
          - name: lb_fct_ast
            description: "Libellé de la position"
          - name: qt_ast
            description: "Quantité détenue"
          - name: mt_ast
            description: "Valorisation en devise locale"
          - name: mt_aci
            description: "Intérêts courus en devise locale"
          - name: rt_prm
            description: "Poids dans le portefeuille"
          - name: rt_pam
            description: "Performance accumulée sur la période"
          - name: mt_pnl
            description: "P&L en devise locale"
          - name: pc_twr
            description: "Time-weighted return de la position"

      - name: st0_fct_xrt
        description: "Taux de change journaliers bruts. Une ligne par devise et par date."
        columns:
          - name: cd_fct_xrt
            description: "Identifiant unique du taux (CD_CCY_YYYYMMDD)"
          - name: cd_ccy
            description: "Code devise source"
          - name: dt_fct
            description: "Date du taux"
          - name: rt_fac
            description: "Facteur de conversion"
          - name: rt_val
            description: "Valeur du taux vers CHF (devise de référence banque)"

      - name: st0_fct_xrt_prices
        description: "Taux de change et prix de marché journaliers. Une ligne par instrument et par date."

      - name: st0_mng
        description: "Relationship managers bruts. Une ligne par manager."
        columns:
          - name: cd_mng
            description: "Code unique du manager"
          - name: lb_mng
            description: "Nom complet du manager"
          - name: cd_mng_grp
            description: "Code du groupe d'appartenance"

      - name: st0_ins
        description: "Référentiel des instruments financiers bruts. Une ligne par instrument."
        columns:
          - name: cd_ins
            description: "Code unique de l'instrument"
          - name: lb_ins
            description: "Libellé de l'instrument"
          - name: cd_ins_grp
            description: "Code du groupe d'instruments (EQU, BND, CSH, ETF)"

      - name: st0_fct_ptf
        description: "Performance portefeuille mensuelle brute. Une ligne par portefeuille et par mois."
        columns:
          - name: cd_fct_ptf
            description: "Identifiant technique unique du fait portefeuille"
          - name: cd_ptf
            description: "Code du portefeuille"
          - name: dt_fct
            description: "Date de fin de mois du fait"
          - name: mt_net_ref
            description: "Actif net en devise de référence"
          - name: mt_aci_ref
            description: "Actif net corrigé des intérêts courus en devise de référence"
          - name: mt_lia_ref
            description: "Passif en devise de référence"
          - name: mt_pnl_ref
            description: "Résultat (P&L) en devise de référence"
          - name: mt_inc_ref_mtd
            description: "Flux entrants month-to-date en devise de référence"
          - name: mt_out_ref_mtd
            description: "Flux sortants month-to-date en devise de référence"
          - name: mt_nnm_inc_ref_mtd
            description: "NNM entrant month-to-date en devise de référence"
          - name: mt_nnm_out_ref_mtd
            description: "NNM sortant month-to-date en devise de référence"
          - name: ts_stg
            description: "Horodatage de chargement en staging"

      - name: st0_fct_mvt
        description: "Mouvements liés aux opérations financières. Une ligne par mouvement."
        columns:
          - name: cd_fct_mvt
            description: "Identifiant technique unique du mouvement"
          - name: cd_fct_ope
            description: "Identifiant de l'opération source"
          - name: cd_ptf
            description: "Code du portefeuille de rattachement"
          - name: cd_ast
            description: "Code de l'actif concerné"
          - name: cd_mvt_typ
            description: "Type de mouvement"
          - name: dt_cta
            description: "Date comptable / de valeur du mouvement"
          - name: mt_mvt
            description: "Montant du mouvement en devise locale"
          - name: mt_mvt_ref
            description: "Montant du mouvement en devise de référence"
          - name: cd_ccy_mvt
            description: "Code devise du mouvement"
          - name: ts_stg
            description: "Horodatage de chargement en staging"

      - name: st0_ccy
        description: "Référentiel des devises brut. Une ligne par devise."
        columns:
          - name: cd_ccy
            description: "Code ISO 4217 de la devise"
          - name: lb_ccy
            description: "Libellé de la devise"

      - name: st0_cty
        description: "Référentiel des pays brut. Une ligne par pays."
        columns:
          - name: cd_cty
            description: "Code ISO 3166 du pays"
          - name: lb_cty
            description: "Libellé du pays"

      - name: st0_prf
        description: "Profils de risque bruts. Une ligne par profil."
        columns:
          - name: cd_prf
            description: "Code unique du profil de risque"
          - name: lb_prf
            description: "Libellé du profil"

      - name: st0_prs
        description: "Personnes physiques et morales brutes. Une ligne par personne."
        columns:
          - name: cd_prs
            description: "Code unique de la personne"
          - name: lb_prs
            description: "Nom complet"
          - name: yn_php
            description: "Indicateur personne physique (Y) ou morale (null)"
          - name: dt_bth
            description: "Date de naissance"
          - name: dt_dth
            description: "Date de décès"
          - name: cd_gnd
            description: "Genre (M/F)"
          - name: cd_prs_typ
            description: "Type de personne"
          - name: cd_cty_nat
            description: "Pays de nationalité"
          - name: cd_cty_dom
            description: "Pays de domicile"

      - name: st0_cli_cat
        description: "Catégories clients brutes. Une ligne par catégorie."
        columns:
          - name: cd_cli_cat
            description: "Code unique de la catégorie client"
          - name: lb_cli_cat
            description: "Libellé de la catégorie client"

      - name: st0_agn
        description: "Agents de distribution bruts. Une ligne par agent."
        columns:
          - name: cd_agn
            description: "Code unique de l'agent"
          - name: lb_agn
            description: "Nom de l'agent"

      - name: st0_buu
        description: "Business units brutes. Une ligne par unité."
        columns:
          - name: cd_buu
            description: "Code unique de la business unit"
          - name: lb_buu
            description: "Nom de la business unit"

      - name: st0_ent 
        description: "Entités juridiques brutes. Une ligne par entité."
        columns:
          - name: cd_ent
            description: "Code unique de l'entité juridique"
          - name: lb_ent
            description: "Raison sociale de l'entité"

      - name: st0_mng_ext
        description: "Gestionnaires externes mandatés bruts. Une ligne par gestionnaire."
        columns:
          - name: cd_mng_ext
            description: "Code unique du gestionnaire externe"
          - name: lb_mng_ext
            description: "Nom du gestionnaire externe"

      - name: st0_mng_grp
        description: "Groupes de managers bruts. Une ligne par groupe."
        columns:
          - name: cd_mng_grp
            description: "Code unique du groupe de managers"
          - name: lb_mng_grp
            description: "Libellé du groupe"

      - name: st0_ins_grp
        description: "Groupes d'instruments financiers bruts. Une ligne par groupe."
        columns:
          - name: cd_ins_grp
            description: "Code unique du groupe d'instruments"
          - name: lb_ins_grp
            description: "Libellé du groupe d'instruments"


      - name: st0_ast
        description: "Référentiel des actifs financiers bruts. Une ligne par actif."
        columns:
          - name: cd_ast
            description: "Code unique de l'actif"
          - name: lb_ast
            description: "Libellé court de l'actif"
          - name: tt_ast
            description: "Description longue de l'actif"
          - name: cd_rat
            description: "Code de notation (AAA, AA... — null pour les actions)"