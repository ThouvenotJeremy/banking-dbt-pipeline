version: 2

models:
  - name: stg_fct_ope
    description: "Opérations financières brutes avec métadonnées techniques STG. Une ligne par opération. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_ope
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1020 = opération)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_ope
        description: "Identifiant technique unique de l'opération"
        tests:
          - not_null
          - unique
      - name: cd_ope
        description: "Code métier de l'opération"
        tests:
          - not_null
      - name: cd_ptf
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: cd_ptf
      - name: cd_ast
        description: "Identifiant de l'actif"
        tests:
          - not_null
      - name: cd_ccy_ope
        description: "Devise de l'opération"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: cd_ope_typ
        description: "Type d'opération"
        tests:
          - not_null
      - name: cd_deb_crd
        description: "Sens de l'opération : D (débit) ou C (crédit)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['D', 'C']
      - name: cd_pos
        description: "Code de la position"
        tests:
          - not_null
      - name: dt_cta
        description: "Date comptable"
        tests:
          - not_null
      - name: dt_exe
        description: "Date d'exécution"
        tests:
          - not_null
      - name: dt_val
        description: "Date de valeur"
        tests:
          - not_null
      - name: qt_ope
        description: "Quantité d'opération"
        tests:
          - not_null
      - name: mt_ope
        description: "Montant en devise locale"
        tests:
          - not_null
      - name: mt_ope_ref
        description: "Montant en devise de référence"
        tests:
          - not_null
      - name: mt_ope_ptf
        description: "Montant en devise portefeuille"
        tests:
          - not_null
      - name: mt_net
        description: "Montant net (après frais)"
        tests:
          - not_null
      - name: mt_net_ref
        description: "Montant net en devise de référence"
        tests:
          - not_null
      - name: mt_net_ptf
        description: "Montant net en devise portefeuille"
        tests:
          - not_null
      - name: yn_pro
        description: "Indicateur opération provisoire (Y/N)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']

  - name: stg_fct_ptf
    description: "Performance mensuelle des portefeuilles. Une ligne par portefeuille et par date. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_ptf
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1021 = performance portefeuille)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_ptf
        description: "Identifiant unique du fait portefeuille"
        tests:
          - not_null
          - unique
      - name: cd_ptf
        description: "Portefeuille"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: cd_ptf
      - name: dt_fct
        description: "Date du fait (fin de mois)"
        tests:
          - not_null
      - name: mt_net_ref
        description: "Actif net en devise de référence"
        tests:
          - not_null
      - name: mt_aci_ref
        description: "Intérêts courus en devise de référence"
        tests:
          - not_null
      - name: mt_lia_ref
        description: "Passif en devise de référence"
        tests:
          - not_null
      - name: mt_net_ptf
        description: "Actif net en devise portefeuille"
        tests:
          - not_null
      - name: mt_aci_ptf
        description: "Intérêts courus en devise portefeuille"
        tests:
          - not_null
      - name: mt_lia_ptf
        description: "Passif en devise portefeuille"
        tests:
          - not_null
      - name: mt_pnl_ref
        description: "P&L en devise de référence"
        tests:
          - not_null
      - name: mt_pnl_ptf
        description: "P&L en devise portefeuille"
        tests:
          - not_null
      - name: mt_inc_ref
        description: "Flux entrants en devise de référence"
        tests:
          - not_null
      - name: mt_out_ref
        description: "Flux sortants en devise de référence"
        tests:
          - not_null
      - name: mt_nnm_inc_ref
        description: "NNM entrant en devise de référence"
        tests:
          - not_null
      - name: mt_nnm_out_ref
        description: "NNM sortant en devise de référence"
        tests:
          - not_null
      - name: mt_int_inc_ref
        description: "Flux d'intérêts entrants"
        tests:
          - not_null
      - name: mt_int_out_ref
        description: "Flux d'intérêts sortants"
        tests:
          - not_null

  - name: stg_fct_mvt
    description: "Mouvements liés aux opérations. Une ligne par mouvement. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_mvt
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1022 = mouvement)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_mvt
        description: "Identifiant unique du mouvement"
        tests:
          - not_null
          - unique
      - name: cd_fct_ope
        description: "Opération source"
        tests:
          - not_null
      - name: cd_ptf
        description: "Portefeuille"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: cd_ptf
      - name: cd_ast
        description: "Actif concerné"
        tests:
          - not_null
      - name: cd_mvt_typ
        description: "Type de mouvement"
        tests:
          - not_null
      - name: cd_mvt_res
        description: "Type de résolution (ex: CSH pour cash)"
        tests:
          - not_null
      - name: cd_pos
        description: "Position concernée"
        tests:
          - not_null
      - name: yn_ext
        description: "Mouvement externe (Y/N)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: dt_val
        description: "Date de valeur"
        tests:
          - not_null
      - name: mt_mvt
        description: "Montant en devise locale"
        tests:
          - not_null
      - name: mt_mvt_ref
        description: "Montant en devise de référence"
        tests:
          - not_null
      - name: cd_ccy_mvt
        description: "Devise du mouvement"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']

  - name: stg_fct_ast
    description: "Positions d'actifs avec métadonnées techniques STG. Colonnes calculées en couche int_. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_ast
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1019 = position)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_ast
        description: "Identifiant unique de la position"
        tests:
          - not_null
          - unique
      - name: cd_pos
        description: "Code position"
        tests:
          - not_null
      - name: cd_pos_typ
        description: "Type position (T/C)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['T', 'C']
      - name: cd_ptf
        description: "Portefeuille"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: cd_ptf
      - name: dt_fct
        description: "Date de valorisation"
        tests:
          - not_null
      - name: cd_ccy
        description: "Devise position"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ccy')
                field: cd_ccy
      - name: cd_ins
        description: "Instrument"
        tests:
          - not_null
      - name: cd_ast
        description: "Actif"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ast')
                field: cd_ast
      - name: lb_fct_ast
        description: "Libellé position"
      - name: qt_ast
        description: "Quantité détenue"
        tests:
          - not_null
      - name: mt_ast
        description: "Valorisation en devise locale"
        tests:
          - not_null
      - name: mt_aci
        description: "Intérêts courus"
        tests:
          - not_null
      - name: rt_prm
        description: "Poids portefeuille"
        tests:
          - not_null
      - name: rt_pam
        description: "Performance accumulée"
        tests:
          - not_null
      - name: mt_pnl
        description: "P&L"
        tests:
          - not_null
      - name: pc_twr
        description: "Time-weighted return"
        tests:
          - not_null

  - name: stg_fct_xrt
    description: "Taux de change avec métadonnées techniques STG. Modèle incrémental — immuable après chargement."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_xrt
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1018 = taux change)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_xrt
        description: "Identifiant unique (CD_CCY_YYYYMMDD)"
        tests:
          - not_null
          - unique
      - name: cd_ccy
        description: "Code devise source"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ccy')
                field: cd_ccy
      - name: dt_fct
        description: "Date du taux"
        tests:
          - not_null
      - name: rt_fac
        description: "Facteur de conversion"
        tests:
          - not_null
      - name: rt_val
        description: "Valeur du taux vers CHF"
        tests:
          - not_null
