version: 2

models:
  - name: stg_fct_ope
    description: "Opérations financières avec métadonnées STG. Fact immuable. MT_OPE_PTF, MT_OPE_REF, MT_NET_PTF, MT_NET_REF calculés en int_."
    config:
      materialized: incremental
    tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: dt_val
            column_B: dt_exe
            or_equal: true
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: dt_val
            column_B: dt_cta
            or_equal: true
    columns:
      - name: id_stg_fct_ope
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        tests:
          - not_null
      - name: vr_stg
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1021 = opération)"
        tests:
          - not_null
      - name: cd_src
        tests:
          - not_null
      - name: cd_pid
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_ope
        description: "Identifiant unique de l'opération"
        tests:
          - not_null
          - unique
      - name: cd_ope
        description: "Code métier"
        tests:
          - not_null
      - name: nb_seq_ptc
        description: "Numéro de séquence"
        tests:
          - not_null
      - name: lb_fct_ope
        description: "Libellé de l'opération"
      - name: cd_fct_ope_ext
        description: "Référence externe"
      - name: cd_ope_typ
        description: "Type d'opération"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ope_typ')
                field: cd_ope_typ
      - name: cd_deb_crd
        description: "Sens débit/crédit"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['D', 'C']
      - name: yn_pro
        description: "Provisoire ou définitif"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: cd_pos
        description: "Position concernée"
        tests:
          - not_null
      - name: cd_ptf
        description: "Portefeuille"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: cd_ptf
      - name: cd_ccy_ope
        description: "Devise de l'opération"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ccy')
                field: cd_ccy
      - name: cd_ast
        description: "Actif"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ast')
                field: cd_ast
      - name: cd_ins
        description: "Instrument"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ins')
                field: cd_ins
      - name: dt_cta
        description: "Date comptable"
        tests:
          - not_null
      - name: dt_exe
        description: "Date d'exécution"
        tests:
          - not_null
      - name: dt_val
        description: "Date de valeur"
        tests:
          - not_null
      - name: qt_ope
        description: "Quantité"
        tests:
          - not_null
      - name: mt_ope
        description: "Montant brut en devise de l'opération"
        tests:
          - not_null
      - name: mt_net
        description: "Montant net en devise de l'opération"
        tests:
          - not_null

  - name: stg_fct_ptf
    description: "Performance mensuelle des portefeuilles en devise du portefeuille. Fact immuable. Les variantes _REF (CHF) et _CLI sont calculées en int_."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_ptf
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        tests:
          - not_null
      - name: vr_stg
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1020 = fait portefeuille)"
        tests:
          - not_null
      - name: cd_src
        tests:
          - not_null
      - name: cd_pid
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_ptf
        description: "Identifiant unique du fait"
        tests:
          - not_null
          - unique
      - name: cd_ptf
        description: "Portefeuille"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: cd_ptf
      - name: dt_fct
        description: "Date de fait"
        tests:
          - not_null
      - name: pc_ptf
        description: "Poids du portefeuille dans l'AUM total"
        tests:
          - not_null
      - name: mt_net
        description: "Actif net en devise du portefeuille"
        tests:
          - not_null
      - name: mt_aci
        description: "Intérêts courus en devise du portefeuille"
        tests:
          - not_null
      - name: mt_lia
        description: "Passif en devise du portefeuille"
        tests:
          - not_null
      - name: mt_pnl
        description: "P&L en devise du portefeuille"
        tests:
          - not_null
      - name: mt_pnc
        description: "Variation nette en devise du portefeuille"
        tests:
          - not_null
      - name: mt_inc_ytd
        description: "Flux entrants YTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_out_ytd
        description: "Flux sortants YTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_nnm_inc_ytd
        description: "NNM entrant YTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_nnm_out_ytd
        description: "NNM sortant YTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_int_inc_ytd
        description: "Flux intérêts entrants YTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_int_out_ytd
        description: "Flux intérêts sortants YTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_inc_mtd
        description: "Flux entrants MTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_out_mtd
        description: "Flux sortants MTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_nnm_inc_mtd
        description: "NNM entrant MTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_nnm_out_mtd
        description: "NNM sortant MTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_int_inc_mtd
        description: "Flux intérêts entrants MTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_int_out_mtd
        description: "Flux intérêts sortants MTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_inc_dtd
        description: "Flux entrants DTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_out_dtd
        description: "Flux sortants DTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_nnm_inc_dtd
        description: "NNM entrant DTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_nnm_out_dtd
        description: "NNM sortant DTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_int_inc_dtd
        description: "Flux intérêts entrants DTD en devise du portefeuille"
        tests:
          - not_null
      - name: mt_int_out_dtd
        description: "Flux intérêts sortants DTD en devise du portefeuille"
        tests:
          - not_null

  - name: stg_fct_mvt
    description: "Mouvements financiers avec métadonnées STG. Deux lignes par opération (titres + cash). Fact immuable. MT_MVT_REF calculé en int_."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_mvt
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        tests:
          - not_null
      - name: vr_stg
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1022 = mouvement)"
        tests:
          - not_null
      - name: cd_src
        tests:
          - not_null
      - name: cd_pid
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_mvt
        description: "Identifiant unique du mouvement"
        tests:
          - not_null
          - unique
      - name: cd_pos
        description: "Position concernée"
        tests:
          - not_null
      - name: cd_fct_ope
        description: "Opération source"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fct_ope')
                field: cd_fct_ope
      - name: yn_ext
        description: "Externe ou interne"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: dt_cta
        description: "Date comptable"
        tests:
          - not_null
      - name: id_obj_mvt_cat
        description: "Catégorie du mouvement"
        tests:
          - not_null
      - name: cd_mvt_typ
        description: "Type de mouvement"
        tests:
          - not_null
      - name: cd_ptf
        description: "Portefeuille"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: cd_ptf
      - name: cd_mvt_res
        description: "Mode de règlement"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CSH', 'SEC']
      - name: cd_ast
        description: "Actif"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ast')
                field: cd_ast
      - name: cd_ins
        description: "Instrument"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ins')
                field: cd_ins
      - name: cd_ccy_mvt
        description: "Devise du mouvement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ccy')
                field: cd_ccy
      - name: mt_mvt
        description: "Montant en devise du mouvement"
        tests:
          - not_null

  - name: stg_fct_ast
    description: "Positions d'actifs avec métadonnées techniques STG. Colonnes calculées en couche int_. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_ast
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1019 = position)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_ast
        description: "Identifiant unique de la position"
        tests:
          - not_null
          - unique
      - name: cd_pos
        description: "Code position"
        tests:
          - not_null
      - name: cd_pos_typ
        description: "Type position (T/C)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['T', 'C']
      - name: cd_ptf
        description: "Portefeuille"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: cd_ptf
      - name: dt_fct
        description: "Date de valorisation"
        tests:
          - not_null
      - name: cd_ccy
        description: "Devise position"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ccy')
                field: cd_ccy
      - name: cd_ins
        description: "Instrument"
        tests:
          - not_null
      - name: cd_ast
        description: "Actif"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ast')
                field: cd_ast
      - name: lb_fct_ast
        description: "Libellé position"
      - name: qt_ast
        description: "Quantité détenue"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: mt_ast
        description: "Valorisation en devise locale"
        tests:
          - not_null
      - name: mt_aci
        description: "Intérêts courus"
        tests:
          - not_null
      - name: rt_prm
        description: "Poids portefeuille"
        tests:
          - not_null
      - name: rt_pam
        description: "Performance accumulée"
        tests:
          - not_null
      - name: mt_pnl
        description: "P&L"
        tests:
          - not_null
      - name: pc_twr
        description: "Time-weighted return"
        tests:
          - not_null

  - name: stg_fct_xrt
    description: "Taux de change avec métadonnées techniques STG. Modèle incrémental — immuable après chargement."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_xrt
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1018 = taux change)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_fct_xrt
        description: "Identifiant unique (CD_CCY_YYYYMMDD)"
        tests:
          - not_null
          - unique
      - name: cd_ccy
        description: "Code devise source"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ccy')
                field: cd_ccy
      - name: dt_fct
        description: "Date du taux"
        tests:
          - not_null
      - name: rt_fac
        description: "Facteur de conversion"
        tests:
          - not_null
      - name: rt_val
        description: "Valeur du taux vers CHF"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
