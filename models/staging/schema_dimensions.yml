version: 2

models:
  - name: stg_cli
    description: "Clients en état courant avec métadonnées techniques STG. Une ligne par client actif. Modèle incrémental — nouveaux clients ajoutés à chaque run, clients existants mis à jour."
    config:
      materialized: incremental
    columns:
      - name: id_stg_cli
        description: "Identifiant technique unique séquentiel. Stable pour un client donné entre les runs."
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement du record en staging"
        tests:
          - not_null
      - name: vr_stg
        description: "Version au format YYYYMMDD dérivée de ts_stg"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant de l'objet technique (1001 = table client)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données (st0_cli)"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant unique de l'exécution dbt (invocation_id)"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre (null par défaut)"
      - name: cd_cli_src
        description: "Code client dans le système source"
        tests:
          - not_null
      - name: cd_cli
        description: "Code unique du client"
        tests:
          - not_null
          - unique
      - name: lb_cli
        description: "Nom complet du client"
        tests:
          - not_null
      - name: lb_cli_alt
        description: "Nom alternatif du client"
      - name: dt_cre
        description: "Date de création du client"
        tests:
          - not_null
      - name: dt_clo
        description: "Date de clôture (null si actif)"
      - name: cd_cty_dom
        description: "Pays de domicile"
        tests:
          - not_null
      - name: cd_cty_nat
        description: "Pays de nationalité"
      - name: cd_mng_rel
        description: "Relationship manager responsable"
        tests:
          - not_null
      - name: cd_cli_cat
        description: "Catégorie client"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cli_cat')
                field: cd_cli_cat
      - name: cd_ccy
        description: "Devise de référence du client"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']

