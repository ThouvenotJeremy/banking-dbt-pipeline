  - name: stg_prs
    description: "Personnes physiques et morales avec métadonnées techniques STG. Une ligne par personne. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_prs
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1017 = personne)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_prs_src
        description: "Code personne dans le système source"
        tests:
          - not_null
      - name: cd_prs
        description: "Code unique de la personne"
        tests:
          - not_null
          - unique
      - name: lb_prs
        description: "Nom complet"
        tests:
          - not_null
      - name: yn_php
        description: "Indicateur personne physique (Y) ou morale (null)"
        tests:
          - accepted_values:
              arguments:
                values: ['Y']
      - name: dt_bth
        description: "Date de naissance (null pour une personne morale)"
      - name: dt_dth
        description: "Date de décès (null si vivant ou personne morale)"
      - name: cd_gnd
        description: "Genre (M/F, null pour une personne morale)"
        tests:
          - accepted_values:
              arguments:
                values: ['M', 'F']
      - name: cd_prs_typ
        description: "Type de personne (ex: INDIVIDUAL — null pour une personne morale). Domaine ouvert, pas de accepted_values : seule la valeur INDIVIDUAL est présente dans ce jeu de démo."
      - name: cd_cty_nat
        description: "Pays de nationalité"
        tests:
          - relationships:
              arguments:
                to: ref('stg_cty')
                field: cd_cty
      - name: cd_cty_dom
        description: "Pays de domicile"
        tests:
          - relationships:
              arguments:
                to: ref('stg_cty')
                field: cd_cty

  - name: stg_set_cal
    description: "Calendrier de dates de fait (fins de mois + date du jour) avec métadonnées techniques STG. Modèle incrémental, sans métadonnées techniques standard (pas de source st0_* : calendrier généré, pas lu)."
    config:
      materialized: incremental
    columns:
      - name: dt_fct
        description: "Date de fait du calendrier"
        tests:
          - not_null
          - unique
      - name: vr_dwh_cal
        description: "Version YYYYMMDD de la date"
        tests:
          - not_null
      - name: cd_cal
        description: "Code calendrier (constante, 1)"
        tests:
          - not_null

