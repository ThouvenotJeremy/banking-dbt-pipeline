version: 2

models:
  - name: stg_cli
    description: "Clients extraits du core banking. Une ligne par client actif."
    columns:
      - name: client_id
        description: "Identifiant unique du client"
        tests:
          - not_null
          - unique
      - name: client_name
        description: "Nom complet du client"
        tests:
          - not_null
      - name: client_name_alt
        description: "Nom alternatif du client (format NOM Prénom)"
      - name: client_category
        description: "Catégorie du client : PRIVATE ou RETAIL"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PRIVATE', 'RETAIL']
      - name: currency
        description: "Devise de référence du client"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: country
        description: "Pays de domicile"
        tests:
          - not_null
      - name: nationality
        description: "Pays de nationalité (peut différer du domicile)"
      - name: relationship_manager_id
        description: "RM responsable du client"
        tests:
          - not_null
      - name: opening_date
        description: "Date d'ouverture du client"
        tests:
          - not_null
      - name: closing_date
        description: "Date de clôture du client (null si actif)"
      - name: loaded_at
        description: "Horodatage de chargement en staging"

  - name: stg_ptf
    description: "Portefeuilles extraits du core banking. Une ligne par portefeuille actif."
    columns:
      - name: ptf_id
        description: "Identifiant unique du portefeuille"
        tests:
          - not_null
          - unique
      - name: ptf_name
        description: "Libellé du portefeuille"
        tests:
          - not_null
      - name: ptf_name_alt
        description: "Libellé alternatif du portefeuille (format court)"
      - name: client_id
        description: "Client propriétaire du portefeuille"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cli')
                field: client_id
      - name: currency
        description: "Devise de référence du portefeuille"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: risk_profile
        description: "Profil de risque : GROWTH, BALANCED, CONSERV"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GROWTH', 'BALANCED', 'CONSERV']
      - name: manager_id
        description: "RM gestionnaire du portefeuille"
        tests:
          - not_null
      - name: ext_manager_id
        description: "Gestionnaire externe mandaté (null si gérance interne)"
      - name: agent_id
        description: "Agent de distribution rattaché au portefeuille"
      - name: entity_id
        description: "Entité juridique de rattachement du portefeuille"
        tests:
          - not_null
      - name: business_unit_id
        description: "Business unit responsable du portefeuille"
        tests:
          - not_null
      - name: opening_date
        description: "Date d'ouverture du portefeuille"
        tests:
          - not_null
      - name: closing_date
        description: "Date de clôture du portefeuille (null si actif)"
      - name: loaded_at
        description: "Horodatage de chargement en staging"

  - name: stg_fct_ope
    description: "Opérations financières brutes. Une ligne par opération."
    columns:
      - name: fct_ope_id
        description: "Identifiant technique unique de l'opération"
        tests:
          - not_null
          - unique
      - name: ope_id
        description: "Code métier de l'opération"
        tests:
          - not_null
          - unique
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: ptf_id
      - name: asset_id
        description: "Identifiant de l'asset"
        tests:
          - not_null
      - name: currency
        description: "Devise de l'opération"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: ope_type
        description: "Type d'opération : BUY ou SELL"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: debit_credit
        description: "Sens de l'opération : D (débit/achat) ou C (crédit/vente)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['D', 'C']
      - name: pos_id
        description: "Identifiant de la position concernée"
        tests:
          - not_null
      - name: accounting_date
        description: "Date comptable de l'opération"
        tests:
          - not_null
      - name: execution_date
        description: "Date d'exécution de l'opération"
        tests:
          - not_null
      - name: value_date
        description: "Date de valeur de l'opération"
        tests:
          - not_null
      - name: quantity
        description: "Quantité de titres échangés"
        tests:
          - not_null
      - name: amount
        description: "Montant brut en devise locale"
        tests:
          - not_null
      - name: amount_ref
        description: "Montant brut en devise de référence"
        tests:
          - not_null
      - name: amount_ptf
        description: "Montant brut en devise du portefeuille"
        tests:
          - not_null
      - name: amount_net
        description: "Montant net en devise locale (après frais)"
        tests:
          - not_null
      - name: amount_net_ref
        description: "Montant net en devise de référence"
        tests:
          - not_null
      - name: amount_net_ptf
        description: "Montant net en devise du portefeuille"
        tests:
          - not_null
      - name: is_provisional
        description: "Indicateur d'opération provisoire"
      - name: loaded_at
        description: "Date de chargement en staging"

  - name: stg_mng
    description: "Relationship Managers extraits du core banking. Une ligne par manager."
    columns:
      - name: manager_id
        description: "Identifiant unique du manager"
        tests:
          - not_null
          - unique
      - name: manager_name
        description: "Nom complet du manager"
        tests:
          - not_null
      - name: manager_group_id
        description: "Groupe / équipe du manager"
        tests:
          - not_null
      - name: timestamp
        description: "Horodatage de chargement en staging"
        tests:
          - not_null

  - name: stg_ins
    description: "Instruments financiers extraits du core banking. Une ligne par instrument."
    columns:
      - name: ins_id
        description: "Identifiant unique de l'instrument"
        tests:
          - not_null
          - unique
      - name: ins_name
        description: "Libellé de l'instrument"
        tests:
          - not_null
      - name: ins_grp_id
        description: "Groupe d'instruments"
        tests:
          - not_null
      - name: loaded_at
        description: "Date de chargement en staging"
        tests:
          - not_null

  - name: stg_fct_ptf
    description: "Performance mensuelle des portefeuilles. Une ligne par portefeuille et par date."
    columns:
      - name: fct_ptf_id
        description: "Identifiant technique unique du fait portefeuille"
        tests:
          - not_null
          - unique
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: ptf_id
      - name: dt_fct
        description: "Date du fait (fin de mois)"
        tests:
          - not_null
      - name: mt_net_ref
        description: "Actif net en devise de référence"
        tests:
          - not_null
      - name: mt_aci_ref
        description: "Intérêts courus en devise de référence"
        tests:
          - not_null
      - name: mt_lia_ref
        description: "Passif en devise de référence"
        tests:
          - not_null
      - name: mt_net_ptf
        description: "Actif net en devise du portefeuille"
        tests:
          - not_null
      - name: mt_aci_ptf
        description: "Intérêts courus en devise du portefeuille"
        tests:
          - not_null
      - name: mt_lia_ptf
        description: "Passif en devise du portefeuille"
        tests:
          - not_null
      - name: pc_ptf
        description: "Poids du portefeuille dans l'AUM total (0 à 1)"
        tests:
          - not_null
      - name: mt_pnl_ref
        description: "P&L en devise de référence"
        tests:
          - not_null
      - name: mt_pnl_ptf
        description: "P&L en devise du portefeuille"
        tests:
          - not_null
      - name: mt_pnl_cli
        description: "P&L en devise du client"
        tests:
          - not_null
      - name: mt_pnc_ref
        description: "Variation nette en devise de référence"
        tests:
          - not_null
      - name: mt_pnc_ptf
        description: "Variation nette en devise du portefeuille"
        tests:
          - not_null
      - name: mt_pnc_cli
        description: "Variation nette en devise du client"
        tests:
          - not_null
      - name: mt_inc_ref
        description: "Flux entrants en devise de référence"
        tests:
          - not_null
      - name: mt_out_ref
        description: "Flux sortants en devise de référence"
        tests:
          - not_null
      - name: mt_nnm_inc_ref
        description: "NNM entrant en devise de référence"
        tests:
          - not_null
      - name: mt_nnm_out_ref
        description: "NNM sortant en devise de référence"
        tests:
          - not_null
      - name: mt_int_inc_ref
        description: "Flux d'intérêts entrants en devise de référence"
        tests:
          - not_null
      - name: mt_int_out_ref
        description: "Flux d'intérêts sortants en devise de référence"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement en staging"
        tests:
          - not_null

  - name: stg_fct_mvt
    description: "Mouvements liés aux opérations financières. Une ligne par mouvement."
    columns:
      - name: fct_mvt_id
        description: "Identifiant technique unique du mouvement"
        tests:
          - not_null
          - unique
      - name: fct_ope_id
        description: "Opération source du mouvement"
        tests:
          - not_null
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: ptf_id
      - name: asset_id
        description: "Identifiant de l'actif concerné"
        tests:
          - not_null
      - name: mvt_typ_id
        description: "Type de mouvement"
        tests:
          - not_null
      - name: mvt_res_id
        description: "Type de résolution du mouvement (ex : CSH pour cash settlement)"
        tests:
          - not_null
      - name: pos_id
        description: "Position concernée par le mouvement"
        tests:
          - not_null
      - name: is_external
        description: "Flag mouvement externe (Y/N)"
        tests:
          - not_null
      - name: value_date
        description: "Date de valeur du mouvement"
        tests:
          - not_null
      - name: amount
        description: "Montant du mouvement en devise locale"
        tests:
          - not_null
      - name: amount_ref
        description: "Montant du mouvement en devise de référence"
        tests:
          - not_null
      - name: currency
        description: "Devise du mouvement"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: loaded_at
        description: "Horodatage de chargement en staging"
        tests:
          - not_null

  - name: stg_fct_ast
    description: "Positions d'actifs extraites du core banking. Une ligne par position et par date de valorisation."
    columns:
      - name: fct_ast_id
        description: "Identifiant technique unique de la position"
        tests:
          - not_null
          - unique
      - name: pos_id
        description: "Identifiant de la position"
        tests:
          - not_null
      - name: pos_typ_id
        description: "Type de position"
        tests:
          - not_null
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: ptf_id
      - name: asset_id
        description: "Identifiant de l'actif"
        tests:
          - not_null
      - name: currency
        description: "Devise de la position"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: quantity
        description: "Quantité détenue"
        tests:
          - not_null
      - name: amount
        description: "Valorisation de la position en devise locale"
        tests:
          - not_null
      - name: amount_ptf
        description: "Valorisation en devise du portefeuille"
        tests:
          - not_null
      - name: amount_cli
        description: "Valorisation en devise du client"
        tests:
          - not_null
      - name: amount_ref
        description: "Valorisation en devise de référence — source unique pour les calculs AUM cross-currency"
        tests:
          - not_null
      - name: accrued_interest_ref
        description: "Intérêts courus en devise de référence"
        tests:
          - not_null
      - name: pnl_ref
        description: "P&L de la période en devise de référence"
        tests:
          - not_null
      - name: net_change_ref
        description: "Variation nette de la position en devise de référence"
        tests:
          - not_null
      - name: weight_ptf
        description: "Poids de la position dans le portefeuille (RT_PRM)"
        tests:
          - not_null
      - name: value_date
        description: "Date de valorisation"
        tests:
          - not_null
      - name: loaded_at
        description: "Date de chargement en staging"
        tests:
          - not_null

  - name: stg_set_cal
    description: "Calendrier des dates de fait. Génère une ligne par fin de mois depuis janvier 2024 jusqu'à aujourd'hui."
    columns:
      - name: dt_fct
        description: "Date de fait (dernier jour du mois, ou date du jour pour le mois courant)"
        tests:
          - not_null
          - unique
      - name: vr_dwh_cal
        description: "Représentation entière de la date au format YYYYMMDD"
        tests:
          - not_null
      - name: cd_cal
        description: "Code calendrier (valeur fixe : 1)"
        tests:
          - not_null

  - name: stg_ope_typ
    description: "Types d'opérations financières. Une ligne par type."
    columns:
      - name: ope_typ_id
        description: "Code identifiant du type d'opération"
        tests:
          - not_null
          - unique
      - name: ope_typ_name
        description: "Libellé du type d'opération"
        tests:
          - not_null
      - name: is_nnm
        description: "Flag Net New Money"
        tests:
          - not_null
      - name: is_interest
        description: "Flag intérêt"
        tests:
          - not_null
      - name: is_loan
        description: "Flag prêt"
        tests:
          - not_null

  - name: stg_ccy
    description: "Devises supportées par l'institution. Une ligne par devise."
    columns:
      - name: currency_id
        description: "Code unique de la devise (USD, EUR, CHF, GBP)"
        tests:
          - not_null
          - unique
      - name: currency_name
        description: "Libellé de la devise"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement en staging"
        tests:
          - not_null

  - name: stg_cty
    description: "Pays de domicile des clients. Une ligne par pays."
    columns:
      - name: country_id
        description: "Code unique du pays (ISO 3166)"
        tests:
          - not_null
          - unique
      - name: country_name
        description: "Libellé du pays"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement en staging"
        tests:
          - not_null

  - name: stg_prf
    description: "Profils de risque des portefeuilles. Une ligne par profil."
    columns:
      - name: risk_profile_id
        description: "Code unique du profil de risque (GROWTH, BALANCED, CONSERV)"
        tests:
          - not_null
          - unique
      - name: loaded_at
        description: "Horodatage de chargement en staging"
        tests:
          - not_null

  - name: stg_cli_cat
    description: "Catégories clients (PRIVATE, RETAIL). Une ligne par catégorie."
    columns:
      - name: client_category_id
        description: "Code unique de la catégorie client (PRIVATE, RETAIL)"
        tests:
          - not_null
          - unique
      - name: client_category_name
        description: "Libellé de la catégorie client"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement en staging"
        tests:
          - not_null
  - name: stg_agn
    description: "Agents de distribution rattachés aux portefeuilles."
    columns:
      - name: agent_id
        description: "Identifiant unique de l'agent"
        tests:
          - not_null
          - unique
      - name: agent_name
        description: "Nom de l'agent"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement"
        tests:
          - not_null

  - name: stg_buu
    description: "Business units de la banque."
    columns:
      - name: business_unit_id
        description: "Identifiant unique de la business unit"
        tests:
          - not_null
          - unique
      - name: business_unit_name
        description: "Nom de la business unit"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement"
        tests:
          - not_null

  - name: stg_ent
    description: "Entités juridiques de la banque."
    columns:
      - name: entity_id
        description: "Identifiant unique de l'entité"
        tests:
          - not_null
          - unique
      - name: entity_name
        description: "Nom de l'entité juridique"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement"
        tests:
          - not_null

  - name: stg_mng_ext
    description: "Gestionnaires externes mandatés sur certains portefeuilles."
    columns:
      - name: ext_manager_id
        description: "Identifiant unique du gestionnaire externe"
        tests:
          - not_null
          - unique
      - name: ext_manager_name
        description: "Nom du gestionnaire externe"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement"
        tests:
          - not_null

  - name: stg_mng_grp
    description: "Groupes / équipes des relationship managers."
    columns:
      - name: manager_group_id
        description: "Identifiant unique du groupe"
        tests:
          - not_null
          - unique
      - name: manager_group_name
        description: "Nom du groupe"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement"
        tests:
          - not_null

  - name: stg_ins_grp
    description: "Groupes d'instruments financiers (EQU, CSH, BND)."
    columns:
      - name: ins_grp_id
        description: "Identifiant unique du groupe d'instruments"
        tests:
          - not_null
          - unique
      - name: ins_grp_name
        description: "Libellé du groupe"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement"
        tests:
          - not_null
