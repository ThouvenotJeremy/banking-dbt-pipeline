version: 2

models:
  - name: stg_cli
    description: "Clients en état courant avec métadonnées techniques STG. Une ligne par client actif. Modèle incrémental — nouveaux clients ajoutés à chaque run, clients existants mis à jour."
    config:
      materialized: incremental
    columns:
      - name: id_stg_cli
        description: "Identifiant technique unique séquentiel. Stable pour un client donné entre les runs."
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement du record en staging"
        tests:
          - not_null
      - name: vr_stg
        description: "Version au format YYYYMMDD dérivée de ts_stg"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant de l'objet technique (1001 = table client)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données (st0_cli)"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant unique de l'exécution dbt (invocation_id)"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre (null par défaut)"
      - name: cd_cli_src
        description: "Code client dans le système source"
        tests:
          - not_null
      - name: cd_cli
        description: "Code unique du client"
        tests:
          - not_null
          - unique
      - name: lb_cli
        description: "Nom complet du client"
        tests:
          - not_null
      - name: lb_cli_alt
        description: "Nom alternatif du client"
      - name: dt_cre
        description: "Date de création du client"
        tests:
          - not_null
      - name: dt_clo
        description: "Date de clôture (null si actif)"
      - name: cd_cty_dom
        description: "Pays de domicile"
        tests:
          - not_null
      - name: cd_cty_nat
        description: "Pays de nationalité"
      - name: cd_mng_rel
        description: "Relationship manager responsable"
        tests:
          - not_null
      - name: cd_cli_cat
        description: "Catégorie client (PRIVATE, RETAIL)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PRIVATE', 'RETAIL']
      - name: cd_ccy
        description: "Devise de référence du client"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']

  - name: stg_ptf
    description: "Portefeuilles en état courant avec métadonnées techniques STG. Une ligne par portefeuille. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_ptf
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1002 = portefeuille)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: id_ptf_tec_typ
        description: "Type technique du portefeuille (1 = standard)"
        tests:
          - not_null
      - name: cd_ptf_src
        description: "Code portefeuille dans le système source"
        tests:
          - not_null
      - name: cd_ptf
        description: "Code unique du portefeuille"
        tests:
          - not_null
          - unique
      - name: lb_ptf
        description: "Libellé du portefeuille"
        tests:
          - not_null
      - name: lb_ptf_alt
        description: "Libellé alternatif"
      - name: dt_cre
        description: "Date d'ouverture"
        tests:
          - not_null
      - name: dt_clo
        description: "Date de clôture (null si actif)"
      - name: cd_cli
        description: "Client propriétaire"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cli')
                field: cd_cli
      - name: cd_ccy
        description: "Devise de référence"
        tests:
          - not_null
      - name: cd_prf
        description: "Profil de risque"
        tests:
          - not_null
      - name: cd_mng
        description: "Relationship manager"
        tests:
          - not_null
      - name: cd_mng_ext
        description: "Gestionnaire externe"
      - name: cd_agn
        description: "Agent de distribution"
      - name: cd_ent
        description: "Entité juridique"
        tests:
          - not_null
      - name: cd_buu
        description: "Business unit"
        tests:
          - not_null

  - name: stg_fct_ope
    description: "Opérations financières brutes. Une ligne par opération."
    columns:
      - name: fct_ope_id
        description: "Identifiant technique unique de l'opération"
        tests:
          - not_null
          - unique
      - name: ope_id
        description: "Code métier de l'opération"
        tests:
          - not_null
          - unique
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: ptf_id
      - name: asset_id
        description: "Identifiant de l'asset"
        tests:
          - not_null
      - name: currency
        description: "Devise de l'opération"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: ope_type
        description: "Type d'opération : BUY ou SELL"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: debit_credit
        description: "Sens de l'opération : D (débit/achat) ou C (crédit/vente)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['D', 'C']
      - name: pos_id
        description: "Identifiant de la position concernée"
        tests:
          - not_null
      - name: accounting_date
        description: "Date comptable de l'opération"
        tests:
          - not_null
      - name: execution_date
        description: "Date d'exécution de l'opération"
        tests:
          - not_null
      - name: value_date
        description: "Date de valeur de l'opération"
        tests:
          - not_null
      - name: quantity
        description: "Quantité de titres échangés"
        tests:
          - not_null
      - name: amount
        description: "Montant brut en devise locale"
        tests:
          - not_null
      - name: amount_ref
        description: "Montant brut en devise de référence"
        tests:
          - not_null
      - name: amount_ptf
        description: "Montant brut en devise du portefeuille"
        tests:
          - not_null
      - name: amount_net
        description: "Montant net en devise locale (après frais)"
        tests:
          - not_null
      - name: amount_net_ref
        description: "Montant net en devise de référence"
        tests:
          - not_null
      - name: amount_net_ptf
        description: "Montant net en devise du portefeuille"
        tests:
          - not_null
      - name: is_provisional
        description: "Indicateur d'opération provisoire"
      - name: loaded_at
        description: "Date de chargement en staging"

  - name: stg_mng
    description: "Relationship managers avec métadonnées techniques STG. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_mng
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1012 = manager)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_mng_src
        description: "Code manager dans le système source"
        tests:
          - not_null
      - name: cd_mng
        description: "Code unique du manager"
        tests:
          - not_null
          - unique
      - name: lb_mng
        description: "Nom complet du manager"
        tests:
          - not_null
      - name: cd_mng_grp
        description: "Groupe d'appartenance du manager"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mng_grp')
                field: cd_mng_grp

  - name: stg_ins
    description: "Instruments financiers avec métadonnées techniques STG. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_ins
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1010 = instrument)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_ins_src
        description: "Code instrument dans le système source"
        tests:
          - not_null
      - name: cd_ins
        description: "Code unique de l'instrument"
        tests:
          - not_null
          - unique
      - name: lb_ins
        description: "Libellé de l'instrument"
        tests:
          - not_null
      - name: cd_ins_grp
        description: "Groupe d'instruments (EQU, BND, CSH, ETF)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EQU', 'BND', 'CSH', 'ETF']

  - name: stg_fct_ptf
    description: "Performance mensuelle des portefeuilles. Une ligne par portefeuille et par date."
    columns:
      - name: fct_ptf_id
        description: "Identifiant technique unique du fait portefeuille"
        tests:
          - not_null
          - unique
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: ptf_id
      - name: dt_fct
        description: "Date du fait (fin de mois)"
        tests:
          - not_null
      - name: mt_net_ref
        description: "Actif net en devise de référence"
        tests:
          - not_null
      - name: mt_aci_ref
        description: "Intérêts courus en devise de référence"
        tests:
          - not_null
      - name: mt_lia_ref
        description: "Passif en devise de référence"
        tests:
          - not_null
      - name: mt_net_ptf
        description: "Actif net en devise du portefeuille"
        tests:
          - not_null
      - name: mt_aci_ptf
        description: "Intérêts courus en devise du portefeuille"
        tests:
          - not_null
      - name: mt_lia_ptf
        description: "Passif en devise du portefeuille"
        tests:
          - not_null
      - name: pc_ptf
        description: "Poids du portefeuille dans l'AUM total (0 à 1)"
        tests:
          - not_null
      - name: mt_pnl_ref
        description: "P&L en devise de référence"
        tests:
          - not_null
      - name: mt_pnl_ptf
        description: "P&L en devise du portefeuille"
        tests:
          - not_null
      - name: mt_pnl_cli
        description: "P&L en devise du client"
        tests:
          - not_null
      - name: mt_pnc_ref
        description: "Variation nette en devise de référence"
        tests:
          - not_null
      - name: mt_pnc_ptf
        description: "Variation nette en devise du portefeuille"
        tests:
          - not_null
      - name: mt_pnc_cli
        description: "Variation nette en devise du client"
        tests:
          - not_null
      - name: mt_inc_ref
        description: "Flux entrants en devise de référence"
        tests:
          - not_null
      - name: mt_out_ref
        description: "Flux sortants en devise de référence"
        tests:
          - not_null
      - name: mt_nnm_inc_ref
        description: "NNM entrant en devise de référence"
        tests:
          - not_null
      - name: mt_nnm_out_ref
        description: "NNM sortant en devise de référence"
        tests:
          - not_null
      - name: mt_int_inc_ref
        description: "Flux d'intérêts entrants en devise de référence"
        tests:
          - not_null
      - name: mt_int_out_ref
        description: "Flux d'intérêts sortants en devise de référence"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de chargement en staging"
        tests:
          - not_null

  - name: stg_fct_mvt
    description: "Mouvements liés aux opérations financières. Une ligne par mouvement."
    columns:
      - name: fct_mvt_id
        description: "Identifiant technique unique du mouvement"
        tests:
          - not_null
          - unique
      - name: fct_ope_id
        description: "Opération source du mouvement"
        tests:
          - not_null
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: ptf_id
      - name: asset_id
        description: "Identifiant de l'actif concerné"
        tests:
          - not_null
      - name: mvt_typ_id
        description: "Type de mouvement"
        tests:
          - not_null
      - name: mvt_res_id
        description: "Type de résolution du mouvement (ex : CSH pour cash settlement)"
        tests:
          - not_null
      - name: pos_id
        description: "Position concernée par le mouvement"
        tests:
          - not_null
      - name: is_external
        description: "Flag mouvement externe (Y/N)"
        tests:
          - not_null
      - name: value_date
        description: "Date de valeur du mouvement"
        tests:
          - not_null
      - name: amount
        description: "Montant du mouvement en devise locale"
        tests:
          - not_null
      - name: amount_ref
        description: "Montant du mouvement en devise de référence"
        tests:
          - not_null
      - name: currency
        description: "Devise du mouvement"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: loaded_at
        description: "Horodatage de chargement en staging"
        tests:
          - not_null

  - name: stg_fct_ast
    description: "Positions d'actifs extraites du core banking. Une ligne par position et par date de valorisation."
    columns:
      - name: fct_ast_id
        description: "Identifiant technique unique de la position"
        tests:
          - not_null
          - unique
      - name: pos_id
        description: "Identifiant de la position"
        tests:
          - not_null
      - name: pos_typ_id
        description: "Type de position"
        tests:
          - not_null
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ptf')
                field: ptf_id
      - name: asset_id
        description: "Identifiant de l'actif"
        tests:
          - not_null
      - name: currency
        description: "Devise de la position"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: quantity
        description: "Quantité détenue"
        tests:
          - not_null
      - name: amount
        description: "Valorisation de la position en devise locale"
        tests:
          - not_null
      - name: amount_ptf
        description: "Valorisation en devise du portefeuille"
        tests:
          - not_null
      - name: amount_cli
        description: "Valorisation en devise du client"
        tests:
          - not_null
      - name: amount_ref
        description: "Valorisation en devise de référence — source unique pour les calculs AUM cross-currency"
        tests:
          - not_null
      - name: accrued_interest_ref
        description: "Intérêts courus en devise de référence"
        tests:
          - not_null
      - name: pnl_ref
        description: "P&L de la période en devise de référence"
        tests:
          - not_null
      - name: net_change_ref
        description: "Variation nette de la position en devise de référence"
        tests:
          - not_null
      - name: weight_ptf
        description: "Poids de la position dans le portefeuille (RT_PRM)"
        tests:
          - not_null
      - name: value_date
        description: "Date de valorisation"
        tests:
          - not_null
      - name: loaded_at
        description: "Date de chargement en staging"
        tests:
          - not_null

  - name: stg_set_cal
    description: "Calendrier des dates de fait. Génère une ligne par fin de mois depuis janvier 2024 jusqu'à aujourd'hui."
    columns:
      - name: dt_fct
        description: "Date de fait (dernier jour du mois, ou date du jour pour le mois courant)"
        tests:
          - not_null
          - unique
      - name: vr_dwh_cal
        description: "Représentation entière de la date au format YYYYMMDD"
        tests:
          - not_null
      - name: cd_cal
        description: "Code calendrier (valeur fixe : 1)"
        tests:
          - not_null

  - name: stg_ope_typ
    description: "Types d'opérations avec métadonnées techniques STG. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_ope_typ
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1015 = type opération)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_ope_typ_src
        description: "Code type opération dans le système source"
        tests:
          - not_null
      - name: cd_ope_typ
        description: "Code unique du type d'opération"
        tests:
          - not_null
          - unique
      - name: lb_ope_typ
        description: "Libellé du type d'opération"
        tests:
          - not_null
      - name: yn_nnm
        description: "Indicateur New Net Money"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: yn_int
        description: "Indicateur flux d'intérêts"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']
      - name: yn_loa
        description: "Indicateur prêt"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N']

  - name: stg_ccy
    description: "Devises avec métadonnées techniques STG. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_ccy
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1006 = devise)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_ccy_src
        description: "Code devise dans le système source"
        tests:
          - not_null
      - name: cd_ccy
        description: "Code ISO 4217 de la devise"
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['CHF', 'USD', 'EUR', 'GBP', 'JPY', 'SEK', 'NOK', 'DKK']
      - name: lb_ccy
        description: "Libellé de la devise"
        tests:
          - not_null

  - name: stg_cty
    description: "Pays avec métadonnées techniques STG. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_cty
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: vr_stg
        description: "Version YYYYMMDD"
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1008 = pays)"
        tests:
          - not_null
      - name: cd_src
        description: "Source des données"
        tests:
          - not_null
      - name: cd_pid
        description: "Identifiant d'exécution dbt"
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_cty_src
        description: "Code pays dans le système source"
        tests:
          - not_null
      - name: cd_cty
        description: "Code ISO 3166 du pays"
        tests:
          - not_null
          - unique
      - name: lb_cty
        description: "Libellé du pays"
        tests:
          - not_null

  - name: stg_prf
    description: "Profils de risque avec métadonnées techniques STG. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_prf
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
        tests:
          - not_null
      - name: vr_stg
        tests:
          - not_null
      - name: id_obj_tec
        description: "Identifiant objet technique (1016 = profil risque)"
        tests:
          - not_null
      - name: cd_src
        tests:
          - not_null
      - name: cd_pid
        tests:
          - not_null
      - name: lb_dsc
        description: "Description libre"
      - name: cd_prf_src
        tests:
          - not_null
      - name: cd_prf
        description: "Code unique du profil de risque"
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['GROWTH', 'BALANCED', 'CONSERV', 'DYNAMIC', 'INCOME']
      - name: lb_prf
        description: "Libellé du profil"
        tests:
          - not_null

  - name: stg_prs
    description: "Personnes physiques et morales avec métadonnées techniques STG. Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_st0_prs
        description: "Identifiant technique unique séquentiel"
        tests:
          - not_null
          - unique
      - name: ts_stg
