  - name: int_fct_ast
    description: "Positions d'actifs enrichies : client de rattachement + montants convertis en devise portefeuille (_PTF via pivot CHF) et en CHF (_REF). Modèle incrémental."
    config:
      materialized: incremental
    columns:
      - name: id_stg_fct_ast
        description: "Identifiant technique de la position (issu de stg)"
        tests:
          - not_null
      - name: cd_fct_ast
        description: "Identifiant unique de la position"
        tests:
          - not_null
          - unique
      - name: cd_pos
        description: "Code de la position"
        tests:
          - not_null
      - name: cd_pos_typ
        description: "Type de position (T/C)"
        tests:
          - not_null
      - name: cd_ptf
        description: "Portefeuille de rattachement"
        tests:
          - not_null
      - name: cd_cli
        description: "Client de rattachement (via portefeuille)"
        tests:
          - not_null
      - name: dt_fct
        description: "Date de valorisation"
        tests:
          - not_null
      - name: cd_ccy
        description: "Devise de la position"
        tests:
          - not_null
      - name: cd_ins
        description: "Instrument financier"
        tests:
          - not_null
      - name: cd_ast
        description: "Actif financier"
        tests:
          - not_null
      - name: lb_fct_ast
        description: "Libellé de la position"
      - name: qt_ast
        description: "Quantité détenue"
        tests:
          - not_null
      - name: mt_ast
        description: "Valorisation en devise de la position"
        tests:
          - not_null
      - name: mt_aci
        description: "Intérêts courus en devise de la position"
        tests:
          - not_null
      - name: mt_pnl
        description: "P&L en devise de la position"
        tests:
          - not_null
      - name: xrt_rate_pos
        description: "Taux de change devise position → CHF"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: xrt_rate_ptf
        description: "Taux de change devise portefeuille → CHF"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: mt_ast_ptf
        description: "Valorisation en devise du portefeuille"
        tests:
          - not_null
          - currency_pivot_conversion_consistency:
              arguments:
                native_column: mt_ast
                rate_column: xrt_rate_pos
                pivot_rate_column: xrt_rate_ptf
      - name: mt_aci_ptf
        description: "Intérêts courus en devise du portefeuille"
        tests:
          - not_null
          - currency_pivot_conversion_consistency:
              arguments:
                native_column: mt_aci
                rate_column: xrt_rate_pos
                pivot_rate_column: xrt_rate_ptf
      - name: mt_pnl_ptf
        description: "P&L en devise du portefeuille"
        tests:
          - not_null
          - currency_pivot_conversion_consistency:
              arguments:
                native_column: mt_pnl
                rate_column: xrt_rate_pos
                pivot_rate_column: xrt_rate_ptf
      - name: mt_ast_ref
        description: "Valorisation en CHF (devise de référence banque)"
        tests:
          - not_null
          - currency_conversion_consistency:
              arguments:
                native_column: mt_ast
                rate_column: xrt_rate_pos
      - name: mt_aci_ref
        description: "Intérêts courus en CHF"
        tests:
          - not_null
          - currency_conversion_consistency:
              arguments:
                native_column: mt_aci
                rate_column: xrt_rate_pos
      - name: mt_pnl_ref
        description: "P&L en CHF"
        tests:
          - not_null
          - currency_conversion_consistency:
              arguments:
                native_column: mt_pnl
                rate_column: xrt_rate_pos
      - name: rt_prm
        description: "Poids de la position dans le portefeuille"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: rt_pam
        description: "Performance accumulée"
        tests:
          - not_null
      - name: pc_twr
        description: "Time-weighted return"
        tests:
          - not_null


