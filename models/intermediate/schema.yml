      - name: lb_cty_dom
        description: "Libellé pays de domicile"
        tests:
          - not_null
      - name: cd_cty_nat
        description: "Pays de nationalité"
      - name: cd_mng_rel
        description: "Relationship manager"
        tests:
          - not_null
      - name: lb_mng_rel
        description: "Nom du relationship manager"
        tests:
          - not_null
      - name: dt_cre
        description: "Date de création du client"
        tests:
          - not_null
      - name: dt_clo
        description: "Date de clôture"
      - name: ts_stg
        description: "Timestamp de chargement"
        tests:
          - not_null
      - name: updated_at
        description: "Dernière mise à jour du snapshot"
        tests:
          - not_null
      - name: valid_from
        description: "Début de validité de la version"
        tests:
          - not_null
      - name: valid_to
        description: "Fin de validité (null si version courante)"

