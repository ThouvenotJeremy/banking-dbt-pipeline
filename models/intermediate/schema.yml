version: 2

models:
  - name: int_cli
    description: "Clients historisés via SCD2. Une ligne par client et par date de fait."
    columns:
      - name: dt_fct
        description: "Date de fait"
        tests:
          - not_null
      - name: cd_cli
        description: "Code unique du client"
        tests:
          - not_null
      - name: lb_cli
        description: "Nom complet du client"
        tests:
          - not_null
      - name: lb_cli_alt
        description: "Nom alternatif"
      - name: cd_cli_cat
        description: "Catégorie client"
        tests:
          - not_null
