version: 2

models:
  - name: int_cli
    description: "Clients enrichis avec suivi SCD Type 2. Une ligne par client et par date de fait (dt_fct)."
    columns:
      - name: dt_fct
        description: "Date de fait issue du calendrier"
        tests:
          - not_null
      - name: client_id
        description: "Identifiant unique du client"
        tests:
          - not_null
      - name: client_name
        description: "Nom complet du client"
        tests:
          - not_null
      - name: client_category
        description: "Catégorie du client : PRIVATE ou RETAIL"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PRIVATE', 'RETAIL']
      - name: currency
        description: "Devise de référence du client"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: country
        description: "Pays de domicile"
        tests:
          - not_null
      - name: relationship_manager_id
        description: "RM responsable du client"
        tests:
          - not_null
      - name: opening_date
        description: "Date d'ouverture du client"
        tests:
          - not_null
      - name: closing_date
        description: "Date de clôture du client (null si actif)"
      - name: loaded_at
        description: "Date de chargement depuis la source"
      - name: updated_at
        description: "Horodatage de la dernière mise à jour de l'enregistrement SCD2"
      - name: valid_from
        description: "Début de validité de l'enregistrement SCD2"
        tests:
          - not_null
      - name: nationality
        description: "Pays de nationalité du client (peut différer du domicile)"

  - name: int_ptf
    description: "Portefeuilles enrichis avec suivi SCD Type 2. Une ligne par portefeuille et par date de fait (dt_fct)."
    columns:
      - name: dt_fct
        description: "Date de fait issue du calendrier"
        tests:
          - not_null
      - name: ptf_id
        description: "Identifiant unique du portefeuille"
        tests:
          - not_null
      - name: ptf_name
        description: "Libellé du portefeuille"
        tests:
          - not_null
      - name: client_id
        description: "Client propriétaire du portefeuille"
        tests:
          - not_null
      - name: currency
        description: "Devise de référence du portefeuille"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD', 'CHF', 'EUR', 'GBP']
      - name: risk_profile
        description: "Profil de risque : GROWTH, BALANCED, CONSERV"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GROWTH', 'BALANCED', 'CONSERV']
      - name: loaded_at
        description: "Date de chargement depuis la source"
      - name: updated_at
        description: "Horodatage de la dernière mise à jour de l'enregistrement SCD2"
      - name: valid_from
        description: "Début de validité de l'enregistrement SCD2"
        tests:
          - not_null
      - name: manager_group_name
        description: "Nom du groupe du manager"
        tests:
          - not_null
      - name: ext_manager_id
        description: "Gestionnaire externe mandaté (null si gérance interne)"
      - name: ext_manager_name
        description: "Nom du gestionnaire externe"
      - name: agent_id
        description: "Agent de distribution"
      - name: agent_name
        description: "Nom de l'agent"
      - name: entity_id
        description: "Entité juridique de rattachement"
        tests:
          - not_null
      - name: entity_name
        description: "Nom de l'entité juridique"
        tests:
          - not_null
      - name: business_unit_id
        description: "Business unit responsable"
        tests:
          - not_null
      - name: business_unit_name
        description: "Nom de la business unit"
        tests:
          - not_null

  - name: int_fct_ast
    description: "Positions d'actifs enrichies avec le client de rattachement. Une ligne par position."
    columns:
      - name: fct_ast_id
        description: "Identifiant technique unique de la position"
        tests:
          - not_null
          - unique
      - name: pos_id
        description: "Identifiant de la position"
        tests:
          - not_null
      - name: pos_typ_id
        description: "Type de position"
        tests:
          - not_null
      - name: ptf_id
        description: "Portefeuille de rattachement"
        tests:
          - not_null
      - name: client_id
        description: "Client de rattachement (via portefeuille)"
        tests:
          - not_null
      - name: asset_id
        description: "Identifiant de l'actif"
        tests:
          - not_null
      - name: currency
        description: "Devise de la position"
        tests:
          - not_null
      - name: quantity
        description: "Quantité détenue"
        tests:
          - not_null
      - name: amount_position
        description: "Valorisation en devise locale"
        tests:
          - not_null
      - name: amount_position_ref
        description: "Valorisation en devise de référence — utiliser pour tous les calculs AUM cross-currency"
        tests:
          - not_null
      - name: amount_position_ptf
        description: "Valorisation en devise du portefeuille"
        tests:
          - not_null
      - name: accrued_interest_ref
        description: "Intérêts courus en devise de référence"
        tests:
          - not_null
      - name: pnl_ref
        description: "P&L de la période en devise de référence"
        tests:
          - not_null
      - name: net_change_ref
        description: "Variation nette de la position en devise de référence"
        tests:
          - not_null
      - name: weight_ptf
        description: "Poids de la position dans le portefeuille"
        tests:
          - not_null
      - name: value_date
        description: "Date de valorisation"
        tests:
          - not_null

  - name: int_ptf_idx
    description: "Index des positions par portefeuille et par date. Une ligne par portefeuille, actif et date de fait."
    columns:
      - name: dt_fct
        description: "Date de fait"
        tests:
          - not_null
      - name: ptf_id
        description: "Identifiant du portefeuille"
        tests:
          - not_null
      - name: client_id
        description: "Client propriétaire du portefeuille"
        tests:
          - not_null
      - name: currency
        description: "Devise de référence du portefeuille"
        tests:
          - not_null
      - name: risk_profile
        description: "Profil de risque du portefeuille"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GROWTH', 'BALANCED', 'CONSERV']
      - name: asset_id
        description: "Identifiant de l'actif"
        tests:
          - not_null
      - name: quantity
        description: "Quantité de l'actif détenu"
        tests:
          - not_null
      - name: amount_position
        description: "Valorisation en devise locale"
        tests:
          - not_null
      - name: amount_position_ref
        description: "Valorisation en devise de référence — utiliser pour les agrégations AUM"
        tests:
          - not_null
      - name: pnl_ref
        description: "P&L de la période en devise de référence"
        tests:
          - not_null
      - name: weight_ptf
        description: "Poids de la position dans le portefeuille"
        tests:
          - not_null
      - name: pos_currency
        description: "Devise de la position"
        tests:
          - not_null

          
      - name: int_fct_xrt
        description: "Taux de change journaliers en couche intermédiaire. Une ligne par devise et par date."
        columns:
          - name: fct_xrt_id
            description: "Identifiant technique du taux"
            tests:
              - not_null
              - unique
          - name: currency
            description: "Code devise source"
            tests:
              - not_null
          - name: dt_fct
            description: "Date du taux"
            tests:
              - not_null
          - name: rate_factor
            description: "Facteur de conversion"
            tests:
              - not_null
          - name: rate_value
            description: "Valeur du taux vers CHF (devise de référence banque)"
            tests:
              - not_null

          - name: int_fct_ptf
            description: "Faits portefeuilles mensuels en couche intermédiaire. Renommage des colonnes stg vers nomenclature métier. Une ligne par portefeuille et par date."
            columns:
              - name: fct_ptf_id
                description: "Identifiant technique unique"
                tests:
                  - not_null
                  - unique
              - name: ptf_id
                description: "Portefeuille"
                tests:
                  - not_null
              - name: dt_fct
                description: "Date de fait"
                tests:
                  - not_null
              - name: pc_ptf
                description: "Poids relatif du portefeuille"
                tests:
                  - not_null
              - name: mt_net
                description: "Actif net en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_aci
                description: "Intérêts courus en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_lia
                description: "Passif en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_pnl
                description: "P&L en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_pnc
                description: "Variation nette en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_inc
                description: "Flux entrants en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_out
                description: "Flux sortants en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_nnm_inc
                description: "NNM entrant en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_nnm_out
                description: "NNM sortant en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_int_inc
                description: "Flux d'intérêts entrants en devise du portefeuille"
                tests:
                  - not_null
              - name: mt_int_out
                description: "Flux d'intérêts sortants en devise du portefeuille"
                tests:
                  - not_null
              - name: loaded_at
                description: "Date de chargement"
                tests:
                  - not_null