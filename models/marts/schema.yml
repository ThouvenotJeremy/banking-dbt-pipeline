version: 2

models:
  - name: mart_client_exposure
    description: "Exposition client par asset et par date avec conversion devise."
    config:
      contract:
        enforced: true
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
            max_value: 10000
    columns:
      - name: dt_fct
        description: "Date de fait"
        data_type: date
        tests:
          - not_null
      - name: client_id
        description: "Identifiant client"
        data_type: varchar
        tests:
          - not_null
      - name: asset_id
        description: "Identifiant asset"
        data_type: varchar
        tests:
          - not_null
      - name: currency
        description: "Devise de la position"
        data_type: varchar
        tests:
          - not_null
      - name: xrt_rate
        description: "Taux de change appliqué"
        data_type: double
      - name: amount_position
        description: "Montant de la position en devise locale"
        data_type: double
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: double
      - name: amount_position_base_ccy
        description: "Montant converti en devise de référence"
        data_type: double
        tests:
          - not_null
      - name: weight_pct
        description: "Poids de la position dans le portefeuille client"
        data_type: double
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false
      - name: client_name
        description: "Nom complet du client"
        data_type: varchar
        tests:
          - not_null
      - name: client_category
        description: "Code de la catégorie client (PRIVATE, RETAIL)"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PRIVATE', 'RETAIL']
      - name: client_category_name
        description: "Libellé de la catégorie client"
        data_type: varchar
        tests:
          - not_null
      - name: country
        description: "Code du pays de domicile (ISO 3166)"
        data_type: varchar
        tests:
          - not_null
      - name: country_name
        description: "Libellé du pays"
        data_type: varchar
        tests:
          - not_null
      - name: ptf_id
        description: "Identifiant unique du portefeuille"
        data_type: varchar
        tests:
          - not_null
      - name: ptf_name
        description: "Libellé du portefeuille"
        data_type: varchar
        tests:
          - not_null
      - name: manager_id
        description: "Identifiant du gestionnaire du portefeuille"
        data_type: varchar
        tests:
          - not_null
      - name: manager_name
        description: "Nom du gestionnaire"
        data_type: varchar
        tests:
          - not_null
      - name: risk_profile
        description: "Code du profil de risque (GROWTH, BALANCED, CONSERV)"
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GROWTH', 'BALANCED', 'CONSERV']
      - name: risk_profile_name
        description: "Libellé du profil de risque"
        data_type: varchar
        tests:
          - not_null
      - name: asset_name
        description: "Libellé de l'actif / instrument"
        data_type: varchar
        tests:
          - not_null
      - name: asset_class
        description: "Classe d'actif (EQUITY, BOND, CASH, etc.)"
        data_type: varchar
        tests:
          - not_null

  - name: mart_portfolio_performance
    description: "Performance des portefeuilles avec valorisation FX. Une ligne par portefeuille, actif et date."
    columns:
      - name: ptf_id
        description: "Identifiant du portefeuille"
        tests:
          - not_null
      - name: client_id
        description: "Client propriétaire du portefeuille"
        tests:
          - not_null
      - name: asset_id
        description: "Identifiant de l'actif"
        tests:
          - not_null
      - name: currency
        description: "Devise de la position"
        tests:
          - not_null
      - name: amount_position
        description: "Valorisation de la position en devise locale"
        tests:
          - not_null
      - name: xrt_rate
        description: "Taux de change appliqué vers la devise de référence (USD)"
      - name: xrt_rate_currency
        description: "Devise source du taux de change"
      - name: market_value
        description: "Valorisation de la position en devise locale (identique à amount_position)"
      - name: market_value_usd
        description: "Valorisation de la position convertie en USD"
      - name: performance_date
        description: "Date de valorisation"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de génération de la ligne"

  - name: mart_rm_performance
    description: "Performance des Relationship Managers (gestionnaires). Agrégation des AUM par RM avec métriques YTD et statistiques du book."
    config:
      contract:
        enforced: true
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
            max_value: 1000
    columns:
      - name: dt_fct
        description: "Date de fait"
        data_type: date
        tests:
          - not_null
      - name: manager_id
        description: "Identifiant unique du Relationship Manager"
        data_type: varchar
        tests:
          - not_null
      - name: manager_name
        description: "Nom complet du gestionnaire"
        data_type: varchar
        tests:
          - not_null
      - name: aum_current
        description: "AUM total actuel du book du RM en devise locale"
        data_type: double
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: aum_ytd_start
        description: "AUM du book du RM au 1er janvier de l'année (YTD start)"
        data_type: double
      - name: aum_ytd_variation_pct
        description: "Variation YTD en pourcentage"
        data_type: double
        tests:
          - not_null
      - name: aum_ytd_variation_abs
        description: "Variation YTD en montant absolu"
        data_type: double
        tests:
          - not_null
      - name: client_count
        description: "Nombre unique de clients gérés par le RM"
        data_type: bigint
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                strictly: false
      - name: portfolio_count
        description: "Nombre unique de portefeuilles gérés par le RM"
        data_type: bigint
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                strictly: false
      - name: category_count
        description: "Nombre de catégories clients distinctes gérées"
        data_type: bigint
        tests:
          - not_null
      - name: aum_avg_per_client
        description: "AUM moyen par client du RM"
        data_type: double
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: aum_avg_per_portfolio
        description: "AUM moyen par portefeuille du RM"
        data_type: double
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: performance_date
        description: "Date de génération du rapport"
        data_type: date
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de génération de la ligne"
        data_type: timestamp
        tests:
          - not_null
