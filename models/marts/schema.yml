version: 2

models:
  - name: mart_client_exposure
    description: "Exposition client par asset et par date avec conversion devise."
    config:
      contract:
        enforced: true
    columns:
      - name: dt_fct
        description: "Date de fait"
        data_type: date
        tests:
          - not_null
      - name: client_id
        description: "Identifiant client"
        data_type: varchar
        tests:
          - not_null
      - name: asset_id
        description: "Identifiant asset"
        data_type: varchar
        tests:
          - not_null
      - name: currency
        description: "Devise de la position"
        data_type: varchar
        tests:
          - not_null
      - name: xrt_rate
        description: "Taux de change appliqué"
        data_type: double
      - name: amount_position
        description: "Montant de la position en devise locale"
        data_type: double
        tests:
          - not_null
      - name: amount_position_base_ccy
        description: "Montant converti en devise de référence"
        data_type: double
        tests:
          - not_null
      - name: weight_pct
        description: "Poids de la position dans le portefeuille client"
        data_type: double

  - name: mart_portfolio_performance
    description: "Performance des portefeuilles avec valorisation FX. Une ligne par portefeuille, actif et date."
    columns:
      - name: ptf_id
        description: "Identifiant du portefeuille"
        tests:
          - not_null
      - name: client_id
        description: "Client propriétaire du portefeuille"
        tests:
          - not_null
      - name: asset_id
        description: "Identifiant de l'actif"
        tests:
          - not_null
      - name: currency
        description: "Devise de la position"
        tests:
          - not_null
      - name: amount_position
        description: "Valorisation de la position en devise locale"
        tests:
          - not_null
      - name: xrt_rate
        description: "Taux de change appliqué vers la devise de référence (USD)"
      - name: xrt_rate_currency
        description: "Devise source du taux de change"
      - name: market_value
        description: "Valorisation de la position en devise locale (identique à amount_position)"
      - name: market_value_usd
        description: "Valorisation de la position convertie en USD"
      - name: performance_date
        description: "Date de valorisation"
        tests:
          - not_null
      - name: loaded_at
        description: "Horodatage de génération de la ligne"
