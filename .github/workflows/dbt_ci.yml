name: DBT CI Pipeline

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install dbt-core dbt-duckdb

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat << EOF > ~/.dbt/profiles.yml
          banking_pipeline:
            outputs:
              dev:
                type: duckdb
                path: dev.duckdb
                threads: 1
            target: dev
          EOF

      - name: DBT Deps
        run: dbt deps

      - name: DBT Seed
        run: dbt seed --full-refresh

      - name: DBT Run Staging
        run: dbt run --select staging

      - name: DBT Snapshot
        run: dbt snapshot

      - name: DBT Run
        run: dbt run

      - name: Check layer dependencies
        run: python3 scripts/check_layer_dependencies.py

      - name: DBT Test
        run: dbt test
